<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oracle Real Page</title>
<style>
  .container {
    display: flex;
    flex-direction: column;
    margin: 20px;
    padding: 15px;
    background: #f0f0f0;
    color: #333;
  }
  #header {
    position: relative;
    margin-bottom: 10px;
    padding: 8px;
    color: #1a1a1a;
    background: #e0e0e0;
  }
  .flex-row {
    display: flex;
    flex-direction: row;
    gap: 8px;
    padding: 8px;
    margin: 4px 0;
  }
  .card {
    position: relative;
    margin: 4px;
    padding: 12px;
    background: #ffffff;
    color: #000000;
    border: 1px solid #ccc;
  }
  .highlight {
    background: #ffff00;
    color: #000;
  }
  table.data {
    border-collapse: collapse;
    margin: 8px;
    padding: 4px;
  }
  table.data td {
    border: 1px solid #999;
    padding: 6px;
  }
  .canvas-wrap {
    position: relative;
    margin: 10px 0;
    padding: 5px;
    background: #eee;
  }
  .form-group {
    display: flex;
    flex-direction: column;
    margin: 8px 0;
    padding: 8px;
    background: #fafafa;
  }
  .hidden {
    display: none;
  }
  .absolute-box {
    position: absolute;
    top: 100px;
    left: 50px;
    width: 200px;
    height: 100px;
    background: rgba(255, 0, 0, 0.5);
  }
  .inline-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin: 8px;
    padding: 16px;
    background-color: #f9f9f9;
    color: #222;
  }
</style>
</head>
<body>
<div class="container">
  <h1 id="header">Oracle Real Page</h1>
  <p style="margin: 4px 0; padding: 4px; color: #444;">
    This page tests multiple DOM/CSS/Canvas/Form/Event features.
  </p>

  <div class="flex-row">
    <div class="card inline-card">
      <span class="highlight">Card A</span>
      <p>Content with margin and padding</p>
    </div>
    <div class="card inline-card">
      <span class="highlight">Card B</span>
      <p>Second card in flex row</p>
    </div>
  </div>

  <ul class="list" style="margin: 8px; padding-left: 20px;">
    <li style="color: #aa0000;">Red item</li>
    <li style="color: #00aa00;">Green item</li>
    <li style="color: #0000aa;">Blue item</li>
  </ul>

  <table class="data">
    <tr>
      <td style="font-weight: bold;">Name</td>
      <td>Value</td>
    </tr>
    <tr>
      <td style="font-weight: bold;">Count</td>
      <td>42</td>
    </tr>
  </table>

  <button id="clickBtn" style="margin: 8px; padding: 8px 16px; background: #0088cc; color: #fff; border: none; border-radius: 4px;">
    Click 0 times
  </button>

  <div class="canvas-wrap">
    <canvas id="testCanvas" width="300" height="200" style="border: 1px solid #333; background: #fff;"></canvas>
  </div>

  <div class="form-group">
    <label for="nameInput">Name:</label>
    <input id="nameInput" type="text" placeholder="Enter name" style="margin: 4px 0; padding: 4px;">
    <button type="submit" style="margin: 4px 0; padding: 4px 12px;">Submit</button>
  </div>

  <div id="absContainer" style="position: relative; height: 150px; margin: 8px 0; background: #ddd;">
    <div class="absolute-box"></div>
  </div>

  <div class="hidden">This should not be visible.</div>
</div>

<script>
// Canvas drawing matching oracle-real-page drawCanvas()
(function() {
  const canvas = document.getElementById('testCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  if (!ctx) return;

  // Filled rectangle
  ctx.fillStyle = '#ff6600';
  ctx.fillRect(10, 10, 100, 60);

  // Stroked rectangle
  ctx.strokeStyle = '#0033cc';
  ctx.lineWidth = 2;
  ctx.strokeRect(130, 10, 100, 60);

  // Path (triangle)
  ctx.beginPath();
  ctx.moveTo(10, 90);
  ctx.lineTo(60, 140);
  ctx.lineTo(110, 90);
  ctx.closePath();
  ctx.fillStyle = '#33aa33';
  ctx.fill();

  // Text
  ctx.fillStyle = '#000000';
  ctx.font = '14px sans-serif';
  ctx.fillText('Hello Canvas', 10, 170);

  // Circle
  ctx.beginPath();
  ctx.arc(200, 120, 30, 0, Math.PI * 2);
  ctx.fillStyle = '#9933ff';
  ctx.fill();
})();
</script>
</body>
</html>
