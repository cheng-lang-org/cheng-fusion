<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>live-observe-nested</title>
<style>
table { border-collapse: collapse; }
td, th { border: 1px solid #888; padding: 2px 8px; }
.nest { padding: 4px; border: 1px dashed #77c; }
</style>
</head>
<body>
<div class="nest" data-live-mutable>
<!-- census-target: comment inside mutable subtree -->
<table><thead><tr><th>k</th><th>v</th></tr></thead><tbody><tr><td>x</td><td class="live-movable">cell1</td></tr><tr><td>y</td><td>42</td></tr></tbody></table>
<div><div><div><span>deep1</span> <span>deep2</span></div></div></div>
</div>
<div class="nest" data-live-mutable>
<svg width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#09c"></circle></svg>
<span class="live-movable">m3</span>
<p>para with <em>emph</em> and <strong>strong</strong></p>
</div>
<form onsubmit="return false">
<input data-live-id="t1" type="text">
<textarea data-live-id="ta2"></textarea>
<select data-live-id="sel"><option value="a">a</option><option value="b">b</option></select>
<input data-live-id="cb" type="checkbox">
</form>
</body>
</html>
