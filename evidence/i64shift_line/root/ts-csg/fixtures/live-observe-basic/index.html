<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>live-observe-basic</title>
<style>
.box { padding: 8px; margin: 4px; background: #eee; border: 1px solid #999; }
.hl { color: #b00; }
.movable { display: inline-block; padding: 2px 6px; background: #ddf; }
</style>
</head>
<body>
<h1 data-live-id="title">Live Observe Basic</h1>
<!-- census-target: removal of this comment must surface as unsupported -->
<div id="c1" data-live-mutable class="box"><span class="live-movable">m1</span><p class="hl">alpha</p> lead text <span>beta</span></div>
<div id="c2" data-live-mutable class="box">gamma<ul><li>l1</li><li>l2</li></ul><span class="live-movable">m2</span></div>
<form onsubmit="return false">
<input data-live-id="t1" type="text" placeholder="t1">
<input data-live-id="t2" type="text" value="seed">
<input data-live-id="pw" type="password">
<textarea data-live-id="ta"></textarea>
<select data-live-id="sel"><option value="a">a</option><option value="b">b</option><option value="c">c</option></select>
<input data-live-id="cb" type="checkbox">
<button type="button" data-live-id="btn">noop</button>
</form>
</body>
</html>
