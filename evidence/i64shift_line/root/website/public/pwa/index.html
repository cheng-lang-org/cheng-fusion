<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>cheng MoQ 播放器（WebTransport 秒开验证）</title>
  <style>
    body { font-family: ui-monospace, monospace; background: #0b0f14; color: #d7e2ec; margin: 24px; }
    .card { border: 1px solid #22303f; border-radius: 8px; padding: 16px; margin-bottom: 16px; background: #101720; }
    h1 { font-size: 18px; }
    .ok { color: #4fd07a; }
    .err { color: #ff6b6b; }
    .muted { color: #7f93a8; }
    video { width: 100%; max-width: 640px; background: #000; border-radius: 8px; }
    img { max-width: 320px; border-radius: 8px; border: 1px solid #22303f; }
  </style>
</head>
<body>
  <div class="card">
    <h1>cheng MoQ 播放器 — WebTransport 秒开验证</h1>
    <div id="status" class="muted">初始化…</div>
  </div>
  <div class="card">
    <div>传输层（relay → 浏览器）</div>
    <div id="timings" class="muted"></div>
  </div>
  <div class="card">
    <div>poster</div>
    <img id="poster" alt="poster">
    <div id="poster-info" class="muted"></div>
  </div>
  <div class="card">
    <div>video（首帧）</div>
    <video id="video" controls muted></video>
    <div id="video-info" class="muted"></div>
  </div>
  <script src="moq-wt.js"></script>
  <script>
    "use strict";
    function q(name) {
      return new URLSearchParams(window.location.search).get(name);
    }
    function setStatus(text, cls) {
      const el = document.getElementById("status");
      el.textContent = text;
      el.className = cls || "muted";
    }
    async function main() {
      const relay = q("relay"); // host:port
      const certhash = q("certhash");
      const path = q("path") || "/wt";
      const segment = q("segment") || "object-0";
      const offset = parseInt(q("offset") || "0", 10);
      const length = parseInt(q("length") || "65536", 10);
      const expectedHash = q("hash") || "";
      if (!relay || !certhash) {
        setStatus("缺少参数: ?relay=host:port&certhash=<WT_MOQ_CERTHASH>", "err");
        return;
      }
      const host = relay.split(":")[0];
      const port = parseInt(relay.split(":")[1], 10);
      try {
        const res = await window.MoqWt.moqPlayerOpen(
          { host, port, path, certHashHex: certhash },
          segment, offset, length, expectedHash
        );
        const publishTotalMs = window.MoqWt.announceField(res.announce, "publish_total_ms");
        document.getElementById("timings").innerHTML =
          "connect_ms=" + res.timings.connectMs.toFixed(1) +
          " first_byte_ms=" + res.timings.firstByteMs.toFixed(1) +
          " open_ms=" + res.timings.openMs.toFixed(1) +
          " bytes=" + res.segment.bytes.length +
          " hash=" + res.segment.hash +
          "<br>publish_total_ms=" + publishTotalMs +
          " hash_ok=<span class=ok>true</span>";
        document.getElementById("poster").src =
          URL.createObjectURL(new Blob([res.poster.bytes], { type: "image/jpeg" }));
        document.getElementById("poster-info").textContent =
          res.poster.bytes.length + "B sha256=" + res.poster.hash;
        document.getElementById("video-info").textContent =
          segment + " " + res.segment.bytes.length + "B sha256=" + res.segment.hash;
        const statusEl = document.getElementById("status");
        statusEl.setAttribute("data-result", "OK");
        setStatus("秒开验证通过: " + segment + " " + res.segment.bytes.length + "B", "ok");
      } catch (e) {
        setStatus("失败: " + e.message, "err");
      }
    }
    window.addEventListener("DOMContentLoaded", main);
  </script>
</body>
</html>
