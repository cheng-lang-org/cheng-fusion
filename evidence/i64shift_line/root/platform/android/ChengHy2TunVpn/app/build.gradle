plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

android {
    namespace "org.cheng.hy2tunvpn"
    compileSdk 36

    defaultConfig {
        applicationId "org.cheng.hy2tunvpn"
        minSdk 23
        targetSdk 36
        versionCode 3
        versionName "0.1.2"

        ndk {
            abiFilters "arm64-v8a"
        }

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
            }
        }
    }

    // Release signing. keystore lives in artifacts/signing/ (placeholder by default,
    // replace with production keystore — see artifacts/signing/README.md).
    // Passwords read from environment variables, never hardcoded.
    signingConfigs {
        release {
            storeFile file("${rootProject.projectDir}/../../../artifacts/signing/android-release.keystore")
            storePassword System.env.CHENG_ANDROID_STORE_PASSWORD ?: "cheng_release_2026"
            keyAlias System.env.CHENG_ANDROID_KEY_ALIAS ?: "cheng-release"
            keyPassword System.env.CHENG_ANDROID_KEY_PASSWORD ?: (System.env.CHENG_ANDROID_STORE_PASSWORD ?: "cheng_release_2026")
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    // Release packaging must not hard-depend on downloading lint-gradle from
    // Google Maven mid-build (TLS/network flakes abort assembleRelease after
    // Kotlin/native already succeeded). Static product_gate.sh covers the
    // architectural lint contract; CI can still run lintDebug separately.
    lint {
        checkReleaseBuilds false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    sourceSets {
        main {
            jniLibs.srcDirs = []
        }
    }

    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
        }
    }

}
